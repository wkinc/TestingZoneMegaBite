<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MegaBite OS · Dashboard</title><link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script></head>
<body>
<div id="app"><header class="top" id="top"></header>
<div class="body"><nav class="side" id="side"></nav><main>
  <div class="ph"><div><h2>Dashboard</h2><p id="hello"></p></div></div>
  <div class="banner hide" id="why" style="margin-bottom:18px"><span>💡</span><div><b id="why-t"></b><p id="why-p"></p></div></div>
  <div class="g4" id="kpi"></div>
  <div class="g2">
    <div class="card"><h3 id="t1">Revenue, last 7 days</h3><div class="chart"><canvas id="c-rev"></canvas></div></div>
    <div class="card"><h3 id="t2">Sales by time slot</h3><div class="chart"><canvas id="c-slot"></canvas></div></div>
  </div>
  <div class="g2" style="grid-template-columns:1fr 1fr">
    <div class="card"><h3>Top items (7 days)</h3><div id="top-items"></div></div>
    <div class="card"><h3>Low stock</h3><table><tbody id="low"></tbody></table></div>
  </div>
</main></div></div>
<div class="toast" id="toast"></div>

<script type="module">
  import { db, collection, doc, getDoc, getDocs, query, where, orderBy, limit } from './js/firebase.js';
  import { requireLogin, loadInventory, $, rm, esc } from './js/app.js';

  // Explain the change in plain words: biggest item changes + calendar facts
  function why(rows, last, prev, calLast, calPrev) {
    const byKey = (d) => {
      const m = {};
      rows.filter((r) => r.date === d).forEach((r) => {
        const k = r.item_name + ' at ' + r.time_slot.toLowerCase();
        m[k] = (m[k] || 0) + r.price * r.quantity;
      });
      return m;
    };
    const a = byKey(last), b = byKey(prev);
    const diffs = [...new Set([...Object.keys(a), ...Object.keys(b)])].map((k) => [k, (a[k] || 0) - (b[k] || 0)]);
    const up = diffs.reduce((s, d) => s + d[1], 0) >= 0;
    const top = diffs.filter((d) => (up ? d[1] > 0 : d[1] < 0))
      .sort((x, y) => (up ? y[1] - x[1] : x[1] - y[1])).slice(0, 2);
    const out = [];
    if (top.length) out.push('Biggest ' + (up ? 'gains' : 'drops') + ': ' +
      top.map((t) => `${t[0]} (${t[1] >= 0 ? '+' : '−'}${rm(Math.abs(t[1]))})`).join(' and ') + '.');
    const reasons = [];
    if (calLast?.rain && !calPrev?.rain) reasons.push('it rained');
    if (calLast?.promotion && !calPrev?.promotion) reasons.push('there was a promotion');
    if (calLast?.holiday && !calPrev?.holiday) reasons.push('it was a public holiday');
    if (calLast?.is_weekend && !calPrev?.is_weekend) reasons.push('it was a weekend');
    if (reasons.length) out.push('Possible reasons: ' + reasons.join(', ') + '.');
    return out.join(' ');
  }

  const { profile } = await requireLogin('dashboard');
  $('hello').textContent = 'Signed in as ' + profile.email;

  let revenue = '–', portions = '–', label = 'no sales data', delta = ['', ''];

  // Sales: use the newest day in the data, plus the 6 days before it
  const newest = await getDocs(query(collection(db, 'sales'), orderBy('date', 'desc'), limit(1)));
  if (!newest.empty) {
    const last = newest.docs[0].data().date;
    const from = new Date(new Date(last).getTime() - 6 * 864e5).toISOString().slice(0, 10);
    const rows = (await getDocs(query(collection(db, 'sales'), where('date', '>=', from)))).docs.map((d) => d.data());

    const byDay = {}, bySlot = {}, byItem = {};
    rows.forEach((r) => {
      byDay[r.date] = (byDay[r.date] || 0) + r.price * r.quantity;
      if (r.date === last) bySlot[r.time_slot] = (bySlot[r.time_slot] || 0) + r.price * r.quantity;
      byItem[r.item_name] = (byItem[r.item_name] || 0) + r.quantity;
    });
    const days = Object.keys(byDay).sort();
    const prevDate = days[days.length - 2];
    label = last; revenue = rm(byDay[last]);
    portions = rows.filter((r) => r.date === last).reduce((s, r) => s + r.quantity, 0);

    if (prevDate) {
      const pct = Math.round((byDay[last] / byDay[prevDate] - 1) * 100);
      delta = [(pct >= 0 ? '▲ ' : '▼ ') + Math.abs(pct) + '% vs day before', pct >= 0 ? 'up' : 'dn'];
      const calOf = async (d) => {
        try { const s = await getDoc(doc(db, 'calendar_context', d)); return s.exists() ? s.data() : null; }
        catch { return null; }
      };
      const [cl, cp] = await Promise.all([calOf(last), calOf(prevDate)]);
      $('why-t').textContent = `Revenue went ${pct >= 0 ? 'up' : 'down'} ${Math.abs(pct)}% compared with ${prevDate} (${rm(byDay[last])} vs ${rm(byDay[prevDate])})`;
      $('why-p').textContent = why(rows, last, prevDate, cl, cp);
      $('why').classList.remove('hide');
    }

    $('t1').textContent = 'Revenue, 7 days to ' + last;
    $('t2').textContent = 'Sales by time slot · ' + last;
    const opts = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } };
    new Chart($('c-rev'), { type: 'line', options: opts, data: { labels: days.map((d) => d.slice(5)),
      datasets: [{ data: days.map((d) => byDay[d]), borderColor: '#B85C38', backgroundColor: '#B85C3822', fill: true, tension: .4 }] } });
    const slots = ['Morning', 'Lunch', 'Tea', 'Dinner'];
    new Chart($('c-slot'), { type: 'bar', options: opts, data: { labels: slots,
      datasets: [{ data: slots.map((s) => bySlot[s] || 0), backgroundColor: '#C9A961', borderRadius: 6 }] } });

    const items = Object.entries(byItem).sort((a, b) => b[1] - a[1]).slice(0, 5);
    $('top-items').innerHTML = items.map(([n, q], i) => `<div class="rank"><em>${i + 1}</em>
      <div>${esc(n)}<div class="bar"><i style="width:${q / items[0][1] * 100}%"></i></div></div><b>${q}</b></div>`).join('');
  }

  // Open orders and low stock
  const open = (await getDocs(query(collection(db, 'orders'), where('status', 'in', ['new', 'preparing'])))).size;
  const low = (await loadInventory()).filter((i) => i.stock <= i.reorder_level);

  $('kpi').innerHTML = [
    ['💰', 'Revenue · ' + label, revenue, delta[0], delta[1]],
    ['🍽️', 'Portions sold', portions, '', ''],
    ['👨‍🍳', 'Open orders', open, '', ''],
    ['📦', 'Low-stock items', low.length, low.length ? 'Check inventory' : 'All OK', low.length ? 'dn' : 'up'],
  ].map((k) => `<div class="card kpi"><div class="e">${k[0]}</div><div><small>${k[1]}</small><b>${k[2]}</b><span class="${k[4]}">${k[3]}</span></div></div>`).join('');

  $('low').innerHTML = low.map((i) => `<tr><td>${esc(i.name)}</td><td>${i.stock} ${esc(i.unit)}</td><td><span class="b bad">Low</span></td></tr>`).join('')
    || '<tr><td class="empty">All stock levels are OK.</td></tr>';
</script>
</body></html>
