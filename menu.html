<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MegaBite OS · Menu</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<div id="app"><header class="top" id="top"></header>
<div class="body"><nav class="side" id="side"></nav><main>
  <div class="ph"><div><h2>Menu management</h2><p>Changes are saved to Firestore.</p></div></div>
  <div class="g2">
    <div class="card"><table><thead><tr><th>Item</th><th>Price (RM)</th><th>Cost (RM)</th><th>Prep qty</th><th>Margin</th><th></th></tr></thead>
      <tbody id="rows"></tbody></table></div>
    <div class="card"><h3>Add item</h3>
      <label for="n">Name</label><input id="n">
      <label for="p">Price (RM)</label><input id="p" type="number" step="0.1">
      <label for="c">Cost per portion (RM)</label><input id="c" type="number" step="0.1">
      <label for="q">Standard prep qty</label><input id="q" type="number">
      <button class="btn pri" style="width:100%;margin-top:16px" id="add">Add to menu</button></div>
  </div>
</main></div></div>
<div class="toast" id="toast"></div>

<script type="module">
  import { db, doc, setDoc, updateDoc } from './js/firebase.js';
  import { requireLogin, loadMenu, logAudit, $, esc, icon, toast } from './js/app.js';

  const { user, role } = await requireLogin('menu');
  const { list } = await loadMenu();
  const field = (m, f, step) => `<input type="number" step="${step}" data-f="${f}" value="${m[f] ?? ''}">`;

  $('rows').innerHTML = list.map((m) => {
    const margin = m.price ? Math.round((m.price - (m.cost_per_portion || 0)) / m.price * 100) + '%' : '–';
    return `<tr data-id="${m.item_id}"><td><span class="thumb">${icon(m)}</span>${esc(m.name)}</td>
      <td>${field(m, 'price', 0.1)}</td><td>${field(m, 'cost_per_portion', 0.1)}</td><td>${field(m, 'standard_prep_qty', 1)}</td>
      <td>${margin}</td><td><button class="btn sec sm" data-save>Save</button></td></tr>`;
  }).join('');

  $('rows').onclick = async (e) => {            // PUSH: edit an item
    if (!e.target.closest('[data-save]')) return;
    const tr = e.target.closest('tr'), upd = {};
    tr.querySelectorAll('input').forEach((i) => upd[i.dataset.f] = i.value === '' ? null : Number(i.value));
    try {
      await updateDoc(doc(db, 'menu_items', tr.dataset.id), upd);
      logAudit(user, role, 'menu_updated', { collection: 'menu_items', item_id: Number(tr.dataset.id) });
      toast('Saved');
    } catch { toast('Could not save'); }
  };

  $('add').onclick = async () => {              // PUSH: new item (same shape as seed.js)
    const name = $('n').value.trim(); if (!name) return toast('Enter a name');
    const id = Math.max(0, ...list.map((m) => m.item_id)) + 1;
    try {
      await setDoc(doc(db, 'menu_items', String(id)), { item_id: id, name,
        price: Number($('p').value) || null, cost_per_portion: Number($('c').value) || null,
        standard_prep_qty: Number($('q').value) || null });
      await logAudit(user, role, 'menu_item_added', { collection: 'menu_items', item_id: id });
      location.reload();
    } catch { toast('Could not add the item'); }
  };
</script>
</body></html>
