<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MegaBite OS · Log in</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<section id="login">
  <div class="brand">
    <div class="logo"><i>M</i>MegaBite OS</div>
    <div>
      <h1>Run the whole restaurant from one warm, tidy counter.</h1>
      <p>Orders, menu, stock and waste in one place, with plain-language insights on what to cook and buy next.</p>
      <div class="cups">☕🍜🥘</div>
    </div>
    <p>Trusted by neighbourhood kopitiams and cafés.</p>
  </div>
  <div class="formside"><div class="form">
    <h2>Welcome back</h2>
    <p style="color:var(--mute)">Log in to your restaurant account.</p>
    <label for="em">Email</label><input id="em" type="email" autocomplete="username">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
    <div class="err" id="err"></div>
    <button class="btn pri" id="go">Log in</button>
  </div></div>
</section>

<script type="module">
  import { auth, signInWithEmailAndPassword } from './js/firebase.js';
  import { HOME } from './js/app.js';
  const $ = (id) => document.getElementById(id);

  async function login() {
    $('err').textContent = '';
    try {
      const cred = await signInWithEmailAndPassword(auth, $('em').value.trim(), $('pw').value);
      const role = (await cred.user.getIdTokenResult()).claims.role;
      if (!HOME[role]) { $('err').textContent = 'This account has no role yet.'; return; }
      location.href = HOME[role];
    } catch { $('err').textContent = 'Wrong email or password.'; }
  }
  $('go').onclick = login;
  document.querySelectorAll('input').forEach((i) => i.addEventListener('keydown', (e) => e.key === 'Enter' && login()));
</script>
</body></html>
