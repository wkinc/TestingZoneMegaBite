<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MegaBite OS · Inventory</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<div id="app"><header class="top" id="top"></header>
<div class="body"><nav class="side" id="side"></nav><main>
  <div class="ph"><div><h2>Inventory</h2><p>Stock levels, how many portions you can still make, and what to order.</p></div></div>
  <div class="g2">
    <div class="card"><h3>Ingredients</h3>
      <table><thead><tr><th>Ingredient</th><th>Stock</th><th>Reorder at</th><th>Cost / unit</th><th>Status</th><th></th></tr></thead>
      <tbody id="rows"></tbody></table></div>
    <div class="card"><h3>Servings from current stock</h3>
      <ul class="rcp" id="cap"></ul>
      <p id="note" style="color:var(--mute);margin-top:10px;font-size:13px"></p></div>
  </div>

  <div class="card" style="margin-top:16px"><h3>Suggested ingredient order</h3>
    <div class="tabs" id="otabs"></div>
    <table><thead><tr><th>Ingredient</th><th>Needed</th><th>In stock</th><th>Order</th></tr></thead>
    <tbody id="orows"></tbody></table>
    <p id="onote" style="color:var(--mute);margin-top:10px;font-size:13px"></p></div>
</main></div></div>
<div class="toast" id="toast"></div>

<script type="module">
  import { db, collection, doc, updateDoc, getDocs } from './js/firebase.js';
  import { requireLogin, loadInventory, loadMenu, logAudit, $, rm, esc, toast } from './js/app.js';

  const { user, role } = await requireLogin('inventory');
  const canEdit = role !== 'kitchen';
  const inv = await loadInventory();
  const recipes = (await getDocs(collection(db, 'recipes'))).docs.map((d) => d.data()).sort((a, b) => a.item_id - b.item_id);
  if (recipes.some((r) => r.verified === false)) $('note').textContent = 'Recipe amounts are placeholders until they are verified.';

  const ORDER = ['Essentials', 'Vegetables', 'Protein', 'Grains & staples', 'Sauces & dairy'];
  const pos = (g) => (ORDER.includes(g) ? ORDER.indexOf(g) : 99);

  // ---------- data for the suggested order ----------
  const { byId } = await loadMenu();
  const fc = (await getDocs(collection(db, 'forecasts'))).docs.map((d) => d.data());
  const fdates = [...new Set(fc.map((r) => r.date))].sort();
  let odate = fdates[0] ?? null;

  function row(i) {
    const low = i.stock <= i.reorder_level;
    return `<tr data-id="${i.id}"><td><b>${esc(i.name)}</b></td>
      <td>${canEdit ? `<input type="number" min="0" step="any" value="${i.stock}">` : i.stock} ${esc(i.unit)}</td>
      <td>${i.reorder_level} ${esc(i.unit)}</td><td>${rm(i.cost_per_unit)}</td>
      <td><span class="b ${low ? 'bad' : 'paid'}">${low ? 'Low stock' : 'OK'}</span></td>
      <td>${canEdit ? '<button class="btn sec sm" data-save>Save</button>' : ''}</td></tr>`;
  }

  // Suggested order = forecast portions x recipe quantity - current stock (never below 0)
  function drawOrder() {
    if (!fdates.length) {
      $('otabs').innerHTML = '';
      $('orows').innerHTML = '';
      $('onote').textContent = 'No forecasts yet. Run seed.js first.';
      return;
    }
    $('otabs').innerHTML = ['all', ...fdates].map((d) =>
      `<button class="${d === odate ? 'on' : ''}" data-o="${d}">${d === 'all' ? 'All days' : d.slice(5)}</button>`).join('');

    // forecast portions per item for the chosen day (or all days)
    const portions = {};
    fc.filter((r) => odate === 'all' || r.date === odate).forEach((r) => {
      portions[r.item_id] = (portions[r.item_id] || 0) + Number(r.recommended_prep ?? r.predicted ?? 0);
    });

    // ingredients needed = forecast portions x recipe quantity per portion
    const need = {};
    const hasRecipe = new Set();
    recipes.forEach((rc) => {
      hasRecipe.add(rc.item_id);
      rc.ingredients.forEach((g) => { need[g.id] = (need[g.id] || 0) + (portions[rc.item_id] || 0) * g.qty; });
    });

    const list = inv.filter((i) => need[i.id] > 0).map((i) => ({
      i, need: need[i.id], order: Math.max(0, Math.ceil((need[i.id] - i.stock) * 10) / 10),
    })).sort((a, b) => b.order - a.order);

    $('orows').innerHTML = list.map(({ i, need: n, order }) =>
      `<tr><td><b>${esc(i.name)}</b></td><td>${n.toFixed(1)} ${esc(i.unit)}</td>
       <td>${i.stock} ${esc(i.unit)}</td>
       <td>${order > 0 ? `<span class="b bad">Order ${order} ${esc(i.unit)}</span>` : '<span class="b paid">Enough</span>'}</td></tr>`).join('');

    const missing = Object.keys(portions).filter((id) => !hasRecipe.has(Number(id)))
      .map((id) => byId[id]?.name || 'Item ' + id);
    $('onote').textContent =
      'Order = forecast portions x recipe quantity - current stock (never below 0).' +
      (recipes.some((r) => r.verified === false) ? ' Recipe amounts are placeholders until verified.' : '') +
      (missing.length ? ' Not counted (no recipe yet): ' + missing.join(', ') + '.' : '');
  }

  function draw() {
    const groups = {};
    inv.forEach((i) => (groups[i.category || 'Other'] ||= []).push(i));
    $('rows').innerHTML = Object.entries(groups).sort((a, b) => pos(a[0]) - pos(b[0])).map(([g, items]) =>
      `<tr><td colspan="6" style="background:var(--cream2);font-weight:600">${esc(g)}</td></tr>` + items.map(row).join('')).join('');

    $('cap').innerHTML = recipes.map((r) => {
      let best = Infinity, lim = '';
      r.ingredients.forEach((g) => {
        const n = Math.floor((inv.find((x) => x.id === g.id)?.stock ?? 0) / g.qty);
        if (n < best) { best = n; lim = g.id; }
      });
      const limName = inv.find((x) => x.id === lim)?.name || lim;
      return `<li><span>${esc(r.name)}</span><b>${best} <small style="color:var(--mute);font-weight:400">(limited by ${esc(limName)})</small></b></li>`;
    }).join('');

    drawOrder();
  }

  $('otabs').onclick = (e) => {
    const b = e.target.closest('button[data-o]'); if (!b) return;
    odate = b.dataset.o; drawOrder();
  };

  $('rows').onclick = async (e) => {            // PUSH: update stock
    if (!e.target.closest('[data-save]')) return;
    const tr = e.target.closest('tr'), v = Number(tr.querySelector('input').value);
    if (!(v >= 0)) return toast('Enter 0 or more');
    try {
      await updateDoc(doc(db, 'inventory', tr.dataset.id), { stock: v });
      inv.find((x) => x.id === tr.dataset.id).stock = v;
      logAudit(user, role, 'stock_updated', { collection: 'inventory', item: tr.dataset.id, stock: v });
      draw(); toast('Stock saved');
    } catch { toast('Could not save'); }
  };
  draw();
</script>
</body></html>
